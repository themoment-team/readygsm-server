name: Production CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: readygsm-prod-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy infrastructure
        id: infra
        working-directory: infra
        run: |
          pulumi stack select gsmthemoment-gmail-com/prod
          pulumi up --yes \
            --config "readygsm-infra:hostedZoneName=${{ secrets.HOSTED_ZONE_NAME }}" \
            --config "readygsm-infra:appDomain=${{ secrets.APP_DOMAIN }}"
          echo "instance_id=$(pulumi stack output ec2InstanceId)" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Build and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          docker build -f docker/stage.Dockerfile \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest" \
            .
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ steps.infra.outputs.instance_id }}
          PROD_ECR_IMAGE: ${{ steps.build-image.outputs.image_uri }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROD_MYSQL_USERNAME: ${{ secrets.PROD_MYSQL_USERNAME }}
          PROD_MYSQL_PASSWORD: ${{ secrets.PROD_MYSQL_PASSWORD }}
          PROD_MYSQL_ROOT_PASSWORD: ${{ secrets.PROD_MYSQL_ROOT_PASSWORD }}
          PROD_REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e

          # SSH(22/2222)가 일부 GitHub Actions 러너 네트워크에서 아웃바운드 필터링되는
          # 문제(2026-09-01)로 인해 HTTPS 기반 AWS SSM으로 배포 방식 전환
          COMPOSE_B64=$(base64 -w0 deploy/compose.prod.yml)
          NGINX_B64=$(base64 -w0 docker/nginx.conf)
          BACKUP_B64=$(base64 -w0 deploy/backup-mysql.sh)

          cat > /tmp/remote_script.sh << REMOTE_EOF
          set -e
          mkdir -p /home/ec2-user/readygsm/nginx
          echo "$COMPOSE_B64" | base64 -d > /home/ec2-user/readygsm/compose.prod.yml
          echo "$NGINX_B64" | base64 -d > /home/ec2-user/readygsm/nginx/nginx.conf
          echo "$BACKUP_B64" | base64 -d > /home/ec2-user/readygsm/backup-mysql.sh
          chmod +x /home/ec2-user/readygsm/backup-mysql.sh

          (crontab -l 2>/dev/null | grep -v "backup-mysql"; echo "0 3 * * * /home/ec2-user/readygsm/backup-mysql.sh >> /var/log/mysql-backup.log 2>&1") | crontab -

          cd /home/ec2-user/readygsm

          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

          cat > .env << ENVEOF
          PROD_MYSQL_USERNAME=$PROD_MYSQL_USERNAME
          PROD_MYSQL_PASSWORD=$PROD_MYSQL_PASSWORD
          PROD_MYSQL_ROOT_PASSWORD=$PROD_MYSQL_ROOT_PASSWORD
          PROD_REDIS_PASSWORD=$PROD_REDIS_PASSWORD
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
          KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
          PROD_ECR_IMAGE=$PROD_ECR_IMAGE
          DISCORD_ERROR_WEBHOOK_URL=$DISCORD_ERROR_WEBHOOK_URL
          OPENAI_API_KEY=$OPENAI_API_KEY
          ENVEOF

          docker pull $PROD_ECR_IMAGE

          if docker compose -f compose.prod.yml --env-file .env ps --quiet mysql 2>/dev/null | grep -q .; then
            docker compose -f compose.prod.yml --env-file .env up -d --no-deps app
          else
            docker compose -f compose.prod.yml --env-file .env up -d
          fi

          docker image prune -f
          REMOTE_EOF

          SCRIPT_B64=$(base64 -w0 /tmp/remote_script.sh)
          jq -n --arg cmd "echo $SCRIPT_B64 | base64 -d | bash" '{commands: [$cmd]}' > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --comment "readygsm prod deploy ${{ github.sha }}" \
            --output text --query "Command.CommandId")
          echo "SSM command id: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              break
            fi
            sleep 5
          done

          echo "=== stdout ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "=== stderr ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi
