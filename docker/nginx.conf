server {
    listen 80;
    server_name api.ready.hellogsm.kr;
    return 301 https://api.ready.hellogsm.kr$request_uri;
}

server {
    listen 443 ssl;
    server_name api.ready.hellogsm.kr;

    ssl_certificate     /etc/nginx/certs/live/api.ready.hellogsm.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.ready.hellogsm.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # SSE 스트리밍. 버퍼에 모았다가 내보내면 토큰 단위 전송이 의미를 잃는다
    # location 블록끼리는 설정을 상속하지 않아서 프록시 헤더를 다시 나열한다
    location /api/v1/chat {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        gzip               off;

        # emitter 타임아웃(180초)보다 길어야 애플리케이션이 먼저 스트림을 정리한다
        proxy_read_timeout 200s;
    }
}